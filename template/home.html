<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- क्लासी लुक के लिए प्रीमियम Poppins फ़ॉन्ट -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* स्मूथ एनिमेटेड बैकग्राउंड */
body {
    background: linear-gradient(-45deg, #1f1c2c, #928dab, #2c3e50, #3498db);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    color: #333;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

* {
  box-sizing: border-box;
}

/* प्रीमियम और अट्रैक्टिव नेविगेशन बार */
.navbar {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
}

.navbar .welcome-msg {
    list-style-type: none;
    color: #ffffff;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
}

/* यूजरनेम को कलरफुल और चमकीला बनाने के लिए */
.navbar .welcome-msg span {
    background: linear-gradient(to right, #00f2fe, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
}

/* बेहतरीन लॉगआउट बटन डिज़ाइन */
.logoutbtn {
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: white;
    font-size: 14px;
    font-weight: 600;
    border: none;
    padding: 10px 22px;
    border-radius: 30px;
    box-shadow: 0 4px 15px rgba(255, 75, 43, 0.3);
    transition: all 0.3s ease;
}

.logoutbtn:hover {
    cursor: pointer;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 75, 43, 0.5);
}

/* मुख्य कंटेनर को ग्लास लुक देने के लिए */
.container {
    max-width: 650px;
    margin: 60px auto;
    padding: 0 20px;
}

.todo-wrapper {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.4);
}

/* हेडर डिज़ाइन */
.header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 35px 40px;
    color: white;
    text-align: center;
}

.header h2 {
    margin: 0 0 20px 0;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.15);
}

/* इनपुट फ़ील्ड स्टाइल */
input {
    margin: 0;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 30px 0 0 30px;
    width: 75%;
    padding: 15px 25px;
    float: left;
    font-size: 15px;
    background: rgba(255, 255, 255, 0.9);
    color: #333;
    outline: none;
    transition: all 0.3s;
}

input:focus {
    background: #ffffff;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
}

/* ऐड बटन स्टाइल */
.addBtn {
    padding: 15px;
    width: 25%;
    background: #111;
    color: white;
    float: left;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 0 30px 30px 0;
    border: none;
}

.addBtn:hover {
    background-color: #333;
    letter-spacing: 1px;
}

.header:after {
    content: "";
    display: table;
    clear: both;
}

/* लिस्ट और आइटम्स की स्टाइलिंग */
ul {
  margin: 0;
  padding: 0;
}

ul li {
    cursor: pointer;
    position: relative;
    padding: 18px 50px 18px 50px;
    list-style-type: none;
    background: #ffffff;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.2s ease;
    border-bottom: 1px solid #f0f0f0;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

ul li:last-child {
    border-bottom: none;
}

ul li:nth-child(odd) {
    background: #fbfbfb;
}

ul li:hover {
    background: #f1f3f9;
    padding-left: 55px;
}

/* जब काम पूरा हो जाए (Checked) */
ul li.checked {
    background: #e2e8f0;
    color: #718096;
    text-decoration: line-through;
}

ul li.checked::before {
    content: '';
    position: absolute;
    border-color: #48bb78;
    border-style: solid;
    border-width: 0 3px 3px 0;
    top: 22px;
    left: 20px;
    transform: rotate(45deg);
    height: 14px;
    width: 6px;
}

/* कट (Delete) बटन का क्लासी रूप */
.close {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #a0aec0;
    font-size: 14px;
    transition: all 0.2s ease;
    text-decoration: none;
    padding: 8px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.close:hover {
    background-color: #fff5f5;
    color: #e53e3e;
    transform: translateY(-50%) scale(1.1);
}

/* रीनेम/एडिट बटन का क्लासी रूप */
.edit-icon {
    position: absolute;
    right: 50px;
    top: 50%;
    transform: translateY(-50%);
    color: #4a5568;
    font-size: 16px;
    transition: all 0.2s ease;
    text-decoration: none;
    padding: 8px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.edit-icon:hover {
    background-color: #ebf8ff;
    color: #3182ce;
    transform: translateY(-50%) scale(1.1);
}

/* टाइम का फ़ॉन्ट स्टाइल */
.task-time {
    display: block;
    font-size: 11px;
    color: #718096;
    margin-top: 4px;
    font-weight: 400;
}
</style>
</head>
<body>

  <!-- नेविगेशन बार -->
  <div class="navbar">
    <div class="welcome-msg">Hello <span>{{request.user}}</span> Welcome to ToDo's List Website</div>
    <button onclick="location.href='/signout/'" class="logoutbtn">Logout</button>
  </div>
  
  <!-- मुख्य टू-डू मुख्य भाग -->
  <div class="container">
    <div class="todo-wrapper">
        <div id="myDIV" class="header">
          <h2>My To Do List</h2>
          <form method="post" action="/add/">
              {% csrf_token %}
              <input type="text" id="myInput" placeholder="Title..." name="title" required>
              <button type="submit" class="addBtn">Add</button>
          </form>
        </div>

        <ul id="myUL">
            {% for task in tasks %}
                {% if task.complete is not False %}
                    <!-- पूरा हो चुका टास्क (Checked) -->
                    <li onclick="location.href='/status/{{task.id}}'" class="checked">
                        <span>{{task.title}}</span>
                        <span class="task-time">{{task.time}}</span>
                        <a href="/delete/{{task.id}}" class="close">&#10006;</a>
                    </li>
                {% else %}
                    <!-- बचा हुआ टास्क -->
                    <li onclick="location.href='/status/{{task.id}}'">
                        <span>{{task.title}}</span>
                        <span class="task-time">{{task.time}}</span>
                        <!-- एडिट लिंक का डिज़ाइन सुधारा गया -->
                        <a href="/edit/{{task.id}}" class="edit-icon">&#9998;</a>
                        <a href="/delete/{{task.id}}" class="close">&#10006;</a>
                    </li>
                {% endif %}
            {% endfor %}
        </ul>
    </div>
  </div>

</body>
</html>
